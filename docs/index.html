<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FCMBench Benchmark Leaderboard</title>
  <style>
    :root {
      --bg: #ffffff;
      --panel: rgba(255, 255, 255, 0.96);
      --panel-strong: #ffffff;
      --ink: #121736;
      --muted: #b7b9c2;
      --line: #d9dbe3;
      --accent: #00b85c;
      --accent-soft: #e8fff2;
      --accent-strong: #00984c;
      --gold: #fccc0c;
      --gold-soft: #fff8db;
      --focus: #121736;
      --navy-soft: #f4f6fb;
      --shadow: 0 18px 42px rgba(18, 23, 54, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(0, 184, 92, 0.12), transparent 23rem),
        radial-gradient(circle at 88% 14%, rgba(252, 204, 12, 0.14), transparent 20rem),
        linear-gradient(180deg, #ffffff 0%, #fbfcff 100%);
      font-family: "Avenir Next", "Helvetica Neue", "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    a {
      color: inherit;
    }

    .page {
      max-width: 1280px;
      margin: 0 auto;
      padding: 28px 16px 48px;
    }

    .hero {
      padding: 24px;
      border: 2px solid var(--line);
      border-radius: 22px;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.98), rgba(244, 255, 249, 0.96)),
        linear-gradient(90deg, rgba(0, 184, 92, 0.08), rgba(252, 204, 12, 0.06));
      box-shadow: var(--shadow);
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--accent-strong);
      font-size: 0.82rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-weight: 800;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3.6rem);
      line-height: 0.95;
      letter-spacing: -0.04em;
    }

    .meta-chip {
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.88);
      font-size: 0.88rem;
      color: #7f8393;
    }

    .controls {
      margin-top: 22px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 14px;
      align-items: center;
    }

    .hero-links {
      margin-top: 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .hero-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #ffffff;
      color: var(--ink);
      text-decoration: none;
      font-size: 0.92rem;
      font-weight: 700;
      transition: border-color 0.18s ease, color 0.18s ease, background-color 0.18s ease, transform 0.18s ease;
    }

    .hero-link:hover,
    .hero-link:focus-visible {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent-strong);
      outline: none;
      transform: translateY(-1px);
    }

    .toggle {
      display: inline-flex;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9);
    }

    .toggle button {
      border: 0;
      background: transparent;
      color: #7f8393;
      padding: 10px 16px;
      font: inherit;
      font-weight: 800;
      letter-spacing: 0.06em;
      border-radius: 999px;
      cursor: pointer;
      transition: background-color 0.18s ease, color 0.18s ease, transform 0.18s ease;
    }

    .toggle button.active {
      background: var(--accent);
      color: #ffffff;
      transform: translateY(-1px);
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin-top: 18px;
    }

    .card {
      padding: 16px;
      border-radius: 18px;
      border: 1px solid var(--line);
      background: var(--panel);
      box-shadow: var(--shadow);
      min-height: 132px;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0 auto auto 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--gold));
    }

    .card-label {
      margin: 0 0 8px;
      color: #7f8393;
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 800;
    }

    .card h2,
    .card h3 {
      margin: 0;
    }

    .leader-name {
      font-size: 1.18rem;
      line-height: 1.2;
    }

    .leader-name a {
      text-decoration: none;
      border-bottom: 1px solid transparent;
    }

    .leader-name a:hover,
    .leader-name a:focus-visible {
      border-bottom-color: currentColor;
      outline: none;
    }

    .leader-score {
      margin-top: 10px;
      font-size: 2rem;
      font-weight: 800;
      color: var(--ink);
      letter-spacing: -0.04em;
    }

    .leader-note {
      margin-top: 6px;
      color: #7f8393;
      font-size: 0.92rem;
    }

    .table-wrap {
      margin-top: 18px;
      overflow: auto;
      border-radius: 22px;
      border: 2px solid var(--line);
      background: var(--panel-strong);
      box-shadow: var(--shadow);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1000px;
    }

    thead th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #f8fafc;
      color: var(--ink);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.78rem;
    }

    thead th button {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border: 0;
      background: transparent;
      padding: 0;
      font: inherit;
      color: inherit;
      text-transform: inherit;
      letter-spacing: inherit;
      cursor: pointer;
    }

    thead th button:hover,
    thead th button:focus-visible {
      color: var(--accent-strong);
      outline: none;
    }

    .sort-indicator {
      min-width: 1em;
      text-align: right;
    }

    th,
    td {
      padding: 14px 12px;
      border-bottom: 1px solid #eadfca;
      text-align: left;
      vertical-align: middle;
      white-space: nowrap;
    }

    tbody tr:nth-child(odd) {
      background: #fbfcfe;
    }

    tbody tr:hover {
      background: var(--gold-soft);
    }

    .rank {
      font-weight: 800;
      color: var(--accent-strong);
    }

    .model-link {
      text-decoration: none;
      font-weight: 700;
    }

    .model-link:hover,
    .model-link:focus-visible {
      color: var(--accent-strong);
      outline: none;
    }

    .num {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .max-score {
      font-weight: 800;
      color: var(--ink);
    }

    @media (max-width: 900px) {
      .summary {
        grid-template-columns: 1fr;
      }

      .controls {
        align-items: flex-start;
      }
    }
  </style>
</head>

  <main class="page">
    <section class="hero">
      <p class="eyebrow">FCMBench v1.2</p>
      <h1>Benchmark Leaderboard</h1>

        <div id="third-note" class="leader-note"></div>

    </section>

    <section class="table-wrap" aria-label="Leaderboard table">

            <th class="num"><button type="button" data-sort-key="average">Average <span class="sort-indicator"></span></button></th>
            <th class="num"><button type="button" data-sort-key="IQE">IQE <span class="sort-indicator"></span></button></th>
            <th class="num"><button type="button" data-sort-key="DTR">DTR <span class="sort-indicator"></span></button></th>

            <th class="num"><button type="button" data-sort-key="VC">VC <span class="sort-indicator"></span></button></th>
            <th class="num"><button type="button" data-sort-key="NC">NC <span class="sort-indicator"></span></button></th>
            <th class="num"><button type="button" data-sort-key="RR">RR <span class="sort-indicator"></span></button></th>
          </tr>
        </thead>
        <tbody id="leaderboard-body"></tbody>
      </table>
    </section>
  </main>

    const body = document.getElementById("leaderboard-body");
    const caption = document.getElementById("table-caption");
    const tabFull = document.getElementById("tab-full");
    const tabSmall = document.getElementById("tab-small");
    const sortButtons = Array.from(document.querySelectorAll("thead button[data-sort-key]"));

    const leaderName = document.getElementById("leader-name");
    const leaderScore = document.getElementById("leader-score");
    const leaderNote = document.getElementById("leader-note");
    const runnerupName = document.getElementById("runnerup-name");
    const runnerupScore = document.getElementById("runnerup-score");
    const runnerupNote = document.getElementById("runnerup-note");
    const thirdName = document.getElementById("third-name");
    const thirdScore = document.getElementById("third-score");
    const thirdNote = document.getElementById("third-note");

    const metricColumns = ["average", "IQE", "DTR", "KIE", "CC", "VC", "NC", "RR"];
    let currentSplit = "full";
    let currentSortKey = "average";
    let currentSortDirection = "desc";

    function formatScore(value) {
      return Number(value).toFixed(2);
    }

    function linkedName(entry) {
      return `<a href="${entry.link}" target="_blank" rel="noreferrer">${entry.name}</a>`;
    }

    function fillSummary(entries, splitKey) {
      const [first, second, third] = entries;
      const splitLabel = splitKey.toUpperCase();

      leaderName.innerHTML = linkedName(first);
      leaderScore.textContent = `${formatScore(first.average)}`;
      leaderNote.textContent = `${splitLabel} leader with strong ${first.DTR.toFixed(2)} DTR and ${first.VC.toFixed(2)} VC.`;

      runnerupName.innerHTML = linkedName(second);
      runnerupScore.textContent = `${formatScore(second.average)}`;
      runnerupNote.textContent = `${(first.average - second.average).toFixed(2)} points behind rank 1.`;

      thirdName.innerHTML = linkedName(third);
      thirdScore.textContent = `${formatScore(third.average)}`;
      thirdNote.textContent = `${(second.average - third.average).toFixed(2)} points behind rank 2.`;
    }

    function updateSortIndicators() {
      for (const button of sortButtons) {
        const indicator = button.querySelector(".sort-indicator");
        if (button.dataset.sortKey === currentSortKey) {
          indicator.textContent = currentSortDirection === "asc" ? "▲" : "▼";
        } else {
          indicator.textContent = "";
        }
      }
    }

    function sortEntries(entries) {
      const sorted = [...entries];
      sorted.sort((a, b) => {
        const aValue = a[currentSortKey];
        const bValue = b[currentSortKey];

        if (typeof aValue === "string" && typeof bValue === "string") {
          const comparison = aValue.localeCompare(bValue);
          return currentSortDirection === "asc" ? comparison : -comparison;
        }

        if (aValue === bValue) {
          return a.rank - b.rank;
        }

        return currentSortDirection === "asc" ? aValue - bValue : bValue - aValue;
      });
      return sorted;
    }

    function maxScores(entries) {
      const maxByColumn = {};
      for (const metric of metricColumns) {
        maxByColumn[metric] = Math.max(...entries.map((entry) => entry[metric]));
      }
      return maxByColumn;
    }

    function render() {
      const entries = sortEntries(leaderboardData[currentSplit]);
      const maxima = maxScores(leaderboardData[currentSplit]);

      tabFull.classList.toggle("active", currentSplit === "full");
      tabSmall.classList.toggle("active", currentSplit === "small");
      tabFull.setAttribute("aria-selected", String(currentSplit === "full"));
      tabSmall.setAttribute("aria-selected", String(currentSplit === "small"));
      caption.textContent = `Showing ${currentSplit.toUpperCase()} leaderboard`;
      updateSortIndicators();

      body.innerHTML = entries.map((entry) => `
        <tr>
          <td class="rank">${entry.rank}</td>
          <td><a class="model-link" href="${entry.link}" target="_blank" rel="noreferrer">${entry.name}</a></td>
          <td class="num ${entry.average === maxima.average ? "max-score" : ""}">${formatScore(entry.average)}</td>
          <td class="num ${entry.IQE === maxima.IQE ? "max-score" : ""}">${formatScore(entry.IQE)}</td>
          <td class="num ${entry.DTR === maxima.DTR ? "max-score" : ""}">${formatScore(entry.DTR)}</td>
          <td class="num ${entry.KIE === maxima.KIE ? "max-score" : ""}">${formatScore(entry.KIE)}</td>
          <td class="num ${entry.CC === maxima.CC ? "max-score" : ""}">${formatScore(entry.CC)}</td>
          <td class="num ${entry.VC === maxima.VC ? "max-score" : ""}">${formatScore(entry.VC)}</td>
          <td class="num ${entry.NC === maxima.NC ? "max-score" : ""}">${formatScore(entry.NC)}</td>
          <td class="num ${entry.RR === maxima.RR ? "max-score" : ""}">${formatScore(entry.RR)}</td>
        </tr>
      `).join("");

      fillSummary(leaderboardData[currentSplit], currentSplit);
      window.location.hash = currentSplit;
    }

    tabFull.addEventListener("click", () => {
      currentSplit = "full";
      render();
    });
    tabSmall.addEventListener("click", () => {
      currentSplit = "small";
      render();
    });

    for (const button of sortButtons) {
      button.addEventListener("click", () => {
        const nextKey = button.dataset.sortKey;
        if (currentSortKey === nextKey) {
          currentSortDirection = currentSortDirection === "asc" ? "desc" : "asc";
        } else {
          currentSortKey = nextKey;
          currentSortDirection = nextKey === "name" ? "asc" : "desc";
        }
        render();
      });
    }

    currentSplit = window.location.hash === "#small" ? "small" : "full";
    render();
  </script>
